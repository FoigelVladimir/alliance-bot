{% load l10n %}
{{ join|json_script:"ai-join-state" }}
{% if join.can_join %}
<section class="mt-6 border border-neutral-300 p-4">
  <h2 class="text-xl font-semibold">Подключиться к диалогу</h2>
  <p class="mt-3 text-sm">Обращение будет назначено вам. Дальше студенту отвечает сотрудник.</p>
  <form class="mt-3" method="post" action="{% url 'support-ai-join' join.run_id %}" data-support-command data-ticket-result data-ai-join-command>
    {% csrf_token %}
    <input type="hidden" name="client_operation_id" value="{{ join_operation_id }}">
    <input type="hidden" name="expected_mode_version" value="{{ join.expected_mode_version|unlocalize }}">
    <button class="min-h-12 border border-neutral-700 px-3 py-2 font-semibold" type="submit">Подключиться к диалогу</button>
    <p class="mt-3 text-sm text-red-800" data-command-error role="alert"></p>
    <a class="mt-3 inline-flex min-h-12 items-center underline" data-human-ticket-link hidden>Открыть существующее обращение</a>
  </form>
</section>
{% endif %}
