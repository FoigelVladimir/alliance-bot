<label class="mt-4 block font-semibold" for="event-title">Название</label><input class="mt-2 min-h-12 w-full rounded-lg border border-neutral-400 p-3" id="event-title" name="title" maxlength="200" value="{{ values.title }}" required>
<label class="mt-4 block font-semibold" for="event-sport">Вид спорта</label><input class="mt-2 min-h-12 w-full rounded-lg border border-neutral-400 p-3" id="event-sport" name="sport" maxlength="100" value="{{ values.sport }}" required>
<label class="mt-4 block font-semibold" for="event-format">Формат участия</label>{% if creating %}<select class="mt-2 min-h-12 w-full rounded-lg border border-neutral-400 p-3" id="event-format" name="participation_format"><option value="team"{% if values.participation_format == 'team' %} selected{% endif %}>Командный</option><option value="individual"{% if values.participation_format == 'individual' %} selected{% endif %}>Индивидуальный</option></select>{% else %}<input type="hidden" name="participation_format" value="{{ values.participation_format }}"><p class="mt-2">{% if values.participation_format == 'team' %}Командный{% else %}Индивидуальный{% endif %}</p>{% endif %}
<label class="mt-4 block font-semibold" for="event-start">Плановая дата и время</label><input class="mt-2 min-h-12 w-full rounded-lg border border-neutral-400 p-3" id="event-start" name="planned_start_at" type="datetime-local" value="{{ values.planned_start_at }}" required>
<label class="mt-4 block font-semibold" for="event-timezone">Часовой пояс</label><input class="mt-2 min-h-12 w-full rounded-lg border border-neutral-400 p-3" id="event-timezone" name="timezone_name" value="{{ values.timezone_name }}" placeholder="Europe/Moscow" required>
<label class="mt-4 block font-semibold" for="event-location">Место и адрес</label><input class="mt-2 min-h-12 w-full rounded-lg border border-neutral-400 p-3" id="event-location" name="location" maxlength="500" value="{{ values.location }}" required>
<label class="mt-4 block font-semibold" for="event-description">Условия и описание</label><textarea class="mt-2 w-full rounded-lg border border-neutral-400 p-3" id="event-description" name="description" rows="4" maxlength="20000">{{ values.description }}</textarea>
